<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vielen Dank f&uuml;r Ihre Anfrage bei Europaneel GmbH.">
    <meta name="robots" content="noindex, nofollow">
    <title>Vielen Dank! | Europaneel GmbH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            text-align: center;
        }
        .thank-you-card {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            border-top: 6px solid #D32F2F;
        }
        .icon {
            font-size: 4rem;
            color: #27ae60; /* Gruener Haken */
            margin-bottom: 20px;
        }
        h1 { font-size: 2rem; margin-bottom: 15px; }
        p { color: #666; font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; }
        
        .btn-home {
            background-color: #D32F2F;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-home:hover { background-color: #B71C1C; }

        .cookie-banner {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 9997;
            background: white; box-shadow: 0 -4px 20px rgba(0,0,0,0.13);
            border-top: 3px solid #D32F2F; padding: 18px 20px;
        }
        .cookie-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .cookie-text { flex: 1; min-width: 240px; }
        .cookie-text strong { font-size: 0.98rem; color: #333; display: block; margin-bottom: 4px; }
        .cookie-text p { font-size: 0.85rem; color: #666; margin: 0; line-height: 1.5; }
        .cookie-text a { color: #D32F2F; text-decoration: underline; }
        .cookie-btns { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
        .cookie-decline { padding: 9px 18px; border: 2px solid #ccc; background: white; color: #555; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600; }
        .cookie-accept { padding: 9px 22px; background: #D32F2F; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 700; }

        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px; z-index: 9000;
            background-color: #25D366; color: white; width: 62px; height: 62px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.1rem; box-shadow: 0 4px 18px rgba(37,211,102,0.55);
            transition: transform 0.2s ease, box-shadow 0.2s ease; text-decoration: none;
        }
        .whatsapp-float:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(37,211,102,0.75); }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="icon"><i class="fas fa-check-circle"></i></div>
        <h1>Nachricht gesendet!</h1>
        <p>Vielen Dank f&uuml;r Ihre Anfrage. Wir haben Ihre Daten erhalten und werden uns schnellstm&ouml;glich bei Ihnen melden.</p>
        
        <a href="index.html" class="btn-home">Zur&uuml;ck zur Startseite</a>
    </div>


<div id="cookieBanner" class="cookie-banner">
    <div class="cookie-inner">
        <div class="cookie-text">
            <strong>&#x1F36A; Wir nutzen externe Dienste</strong>
            <p>Andere Seiten dieser Website verwenden Google Maps und reCAPTCHA. Mehr dazu in unserer <a href="index.html#datenschutz">Datenschutzerkl&auml;rung</a>.</p>
        </div>
        <div class="cookie-btns">
            <button class="cookie-decline" onclick="setCookieConsent('necessary')">Nur notwendige</button>
            <button class="cookie-accept" onclick="setCookieConsent('all')">Alle akzeptieren</button>
        </div>
    </div>
</div>

<a href="https://wa.me/4915229383557?text=Hallo%2C%20ich%20interessiere%20mich%20f%C3%BCr%20eine%20K%C3%BChlzelle." class="whatsapp-float" target="_blank" rel="noopener" aria-label="WhatsApp Kontakt">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
(function() {
    window.setCookieConsent = function(choice) {
        localStorage.setItem('ep_consent', choice);
        document.getElementById('cookieBanner').style.display = 'none';
    };
    window.addEventListener('DOMContentLoaded', function() {
        if (!localStorage.getItem('ep_consent')) {
            document.getElementById('cookieBanner').style.display = 'block';
        }
    });
})();
</script>

</body>
</html>
